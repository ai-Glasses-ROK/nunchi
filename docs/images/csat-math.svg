<text class="ink" x="24" y="110" font-size="13" font-weight="600">공개 결과 · 클라우드·대형 (Pyeon et al., 2025 · 46문항)</text>
<text class="ink" x="24" y="134" font-size="12.5">GPT-5 Codex · 이미지</text>
<path class="ref" d="M284.0,123.0 h556.0 a4,4 0 0 1 4,4 v6.0 a4,4 0 0 1 -4,4 h-556.0 z"/>
<text class="ink2" x="850.0" y="134" font-size="11.5">100.0</text>
<text class="ink" x="24" y="164" font-size="12.5">GPT-5 · 이미지</text>
<path class="ref" d="M284.0,153.0 h543.7 a4,4 0 0 1 4,4 v6.0 a4,4 0 0 1 -4,4 h-543.7 z"/>
<text class="ink2" x="837.7" y="164" font-size="11.5">97.8</text>
