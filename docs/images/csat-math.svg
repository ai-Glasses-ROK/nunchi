<path class="s1" d="M284.0,427.0 h174.2 a4,4 0 0 1 4,4 v6.0 a4,4 0 0 1 -4,4 h-174.2 z"/>
<text class="ink2" x="468.2" y="438" font-size="11.5">32% (7/22)</text>
<text class="muted" x="24" y="492" font-size="11.5">공개 결과: arXiv:2511.18649 표 6, 한국어 지시문, 공통+선택 3과목 46문항, 100점 환산. 이 연구: 공통 1~22번, 정답 문항 수 비율.</text>
<text class="muted" x="24" y="508" font-size="11.5">OCR: gemma4:e4b가 문항 이미지를 글(LaTeX)로 옮기고 풀이 모델이 그 글만 봄. 모든 로컬 실행은 같은 노트북(M5 Pro 24GB)의 Ollama.</text>
