# 버전은 Meta 공식 샘플(meta-wearables-dat-android, CameraAccess)과 맞췄습니다.
[versions]
agp = "8.11.1"
kotlin = "2.2.21"
activityCompose = "1.13.0"
composeBom = "2026.05.01"
lifecycle = "2.10.0"
mwdat = "1.0.1"
# 폰 안 LLM 엔진 (Google AI Edge LiteRT-LM, .litertlm 모델 파일)
litertlm = "0.16.1" # 0.17부터는 Kotlin 2.4가 필요해서, 이 프로젝트의 Kotlin 2.2.21과 맞는 마지막 버전
# 테스트 전용: 공식 XML에서 생성된 MAVLink 구현으로 직접 만든 파서를 교차 검증
dronefleetMavlink = "1.1.11"
# 드론 카메라: 5.8GHz FPV 수신기(USB OTG, UVC)를 폰 카메라처럼 읽기
uvcandroid = "1.0.13"
junit = "4.13.2"
orgJson = "20250517"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
mwdat-core = { group = "com.meta.wearable", name = "mwdat-core", version.ref = "mwdat" }
mwdat-camera = { group = "com.meta.wearable", name = "mwdat-camera", version.ref = "mwdat" }
mwdat-mockdevice = { group = "com.meta.wearable", name = "mwdat-mockdevice", version.ref = "mwdat" }
litertlm-android = { group = "com.google.ai.edge.litertlm", name = "litertlm-android", version.ref = "litertlm" }
uvcandroid = { group = "com.herohan", name = "UVCAndroid", version.ref = "uvcandroid" }
dronefleet-mavlink = { group = "io.dronefleet.mavlink", name = "mavlink", version.ref = "dronefleetMavlink" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
