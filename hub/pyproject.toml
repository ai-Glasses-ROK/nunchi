[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nunchi"
version = "0.1.0"
description = "인터넷 없이 동작하는 RAG + 로컬 LLM 허브 (Meta AI 안경용)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Park Sungmo (박성모)" }]
keywords = ["rag", "local-llm", "ollama", "offline", "smart-glasses", "korean"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: Korean",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# 의존성은 일부러 최소로 유지합니다. 오프라인 설치 꾸러미(wheelhouse)를 만들기 쉽게 하기 위해서예요.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "numpy>=1.26",
    "pypdf>=4.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nunchi = "nunchi.cli:main"

[tool.setuptools.packages.find]
include = ["nunchi*"]

[tool.setuptools.package-data]
nunchi = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: 실제 Ollama 서버가 필요한 테스트 (기본 실행에서 자동 건너뜀)"]
