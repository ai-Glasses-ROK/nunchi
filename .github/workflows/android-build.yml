# Android 앱 빌드·린트·단위 테스트 (GitHub 우분투 러너에는 Android SDK가 들어 있음)
# examples/ 의 문서가 APK에 들어가고(폰 단독 RAG) 테스트도 그 문서로 허브와 같은 검색 결과인지 확인하므로 examples/ 변경에도 돕니다.
name: android-build

on:
  push:
    paths: ["clients/android/**", "examples/**", ".github/workflows/android-build.yml"]
  pull_request:
    paths: ["clients/android/**", "examples/**", ".github/workflows/android-build.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug lintDebug testDebugUnitTest
