# Android 앱 빌드·린트 (GitHub 우분투 러너에는 Android SDK가 들어 있음)
name: android-build

on:
  push:
    paths: ["clients/android/**", ".github/workflows/android-build.yml"]
  pull_request:
    paths: ["clients/android/**", ".github/workflows/android-build.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug lintDebug
